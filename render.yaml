# Render Blueprint — voir https://render.com/docs/blueprint-spec
#
# IMPORTANT : Render ne propose PAS de base de données MySQL managée
# (uniquement PostgreSQL), et un service privé (pserv) n'a pas de plan
# free — donc pas de MySQL gratuit hébergé sur Render lui-même. La base
# tourne sur Aiven (offre MySQL gratuite externe) :
#   1. Crée un compte sur https://aiven.io et un service "MySQL" sur le
#      plan gratuit.
#   2. Dans l'onglet "Overview" du service Aiven, récupère : Host, Port,
#      User, Password, et le nom de la base par défaut (souvent
#      "defaultdb").
#   3. Colle ces valeurs dans le dashboard Render, sur le service
#      qct-app, pour les variables DB_HOST / DB_PORT / DB_DATABASE /
#      DB_USERNAME / DB_PASSWORD marquées `sync: false` ci-dessous.
#   4. Aiven force TLS. Ça passe en général sans configuration
#      supplémentaire (chiffrement opportuniste). Si Laravel refuse la
#      connexion pour une histoire de certificat, télécharge le
#      ca.pem d'Aiven et référence-le via la variable d'env
#      MYSQL_ATTR_SSL_CA (voir config/database.php, déjà câblé pour ça).
#
# Le plan `free` du service web Render s'endort après ~15 min sans
# trafic et met 30-50s à se réveiller à la requête suivante — normal,
# pas un bug.
#
# Rappel stockage (voir CLAUDE.md) : le filesystem de Render est éphémère.
# Les images d'items, photos de déclaration et photos de profil (écrites
# via move() dans public/uploads/ et images/) seront perdues à chaque
# redéploiement/redémarrage. Accepté pour l'instant — à corriger plus
# tard avec un disque persistant Render ou un stockage S3-compatible.

services:
  - type: web
    name: qct-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: QCT
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Générez une clé avec `php artisan key:generate --show` en local
      # et collez la valeur (base64:...) dans le dashboard Render.
      - key: APP_KEY
        sync: false
      # A mettre à jour après le premier déploiement avec l'URL
      # https://qct-app.onrender.com attribuée par Render.
      - key: APP_URL
        value: https://qct-app.onrender.com

      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      - key: DB_CONNECTION
        value: mysql
      # Les 5 variables suivantes viennent de l'onglet "Overview" de ton
      # service MySQL sur Aiven (voir commentaire en haut de fichier).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: QCT

      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
